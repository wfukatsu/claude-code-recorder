<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ccrec">
  <!-- A prompt and a record light: what is typed at the prompt is being recorded. -->
  <!-- The prompt is drawn as filled shapes, not a stroke: every renderer draws those alike. -->
  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="#211f1c"/>
  <g fill="#f3efe8">
    <polygon points="11.9,23.48 24.9,34.48 29.1,29.52 16.1,18.52"/>
    <polygon points="24.9,29.52 11.9,40.52 16.1,45.48 29.1,34.48"/>
    <circle cx="14" cy="21" r="3.25"/>
    <circle cx="27" cy="32" r="3.25"/>
    <circle cx="14" cy="43" r="3.25"/>
  </g>
  <circle cx="44" cy="32" r="9.5" fill="#e0703f"/>
</svg>
